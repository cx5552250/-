name: 低空行业每日资讯推送

on:
  schedule:
    # 每天早上8点执行 (UTC时间，北京时间需要减8小时)
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发测试

jobs:
  daily-news-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
    
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 配置企业微信Webhook
      env:
        WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
      run: |
        # 将环境变量写入config.py
        echo "WECHAT_WEBHOOK_URL=$WECHAT_WEBHOOK_URL" > .env
        
    - name: 运行资讯推送程序
      env:
        WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
      run: |
        python main.py
    
    - name: 处理失败情况
      if: failure()
      run: |
        echo "❌ 今日资讯推送失败，请检查日志"
        exit 1
