name: 低空行业每日资讯推送

on:
  schedule:
    # 每天早上8点执行 (UTC时间，北京时间需要减8小时)
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发测试

jobs:
  daily-news-push:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置Python环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 测试企业微信Webhook连通性
      env:
        WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
      run: |
        echo "Webhook URL长度: ${#WECHAT_WEBHOOK_URL}"
        echo "Webhook URL前30字符: ${WECHAT_WEBHOOK_URL:0:30}..."
        echo "--- 发送测试消息 ---"
        curl -s -X POST "$WECHAT_WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -d '{"msgtype":"text","text":{"content":"🔔 低空资讯推送系统测试：Webhook连通性测试成功！"}}'
        echo ""
        echo "--- 测试完成 ---"

    - name: 运行资讯推送程序
      env:
        WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
      run: |
        python main.py
